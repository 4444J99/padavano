name: Public source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stylelint and desktop/mobile browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install the committed dependency graph
        run: npm ci --no-audit --no-fund

      - name: Validate CSS and brand conventions
        run: npm run lint

      - name: Install the browser used by both test projects
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify desktop and mobile behavior
        run: npm test
